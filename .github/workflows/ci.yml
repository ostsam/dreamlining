name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: git diff --check
      - name: Upload redacted fast artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamlining-fast-artifacts
          path: artifacts/
          if-no-files-found: ignore

  full:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium webkit
      - run: bun run test:full
        env:
          DREAM_SKIP_BROWSER: "0"
      - name: Upload redacted full artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamlining-full-artifacts
          path: artifacts/
          if-no-files-found: ignore
